<script>
    function toggleIframeSize() {
        const iframe = document.getElementById('grc-iframe');
        iframe.style.height = (iframe.style.height === '920px') ? '680px' : '920px';
    }

    function copyToClipboard(text, message) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        });
    }

    function openLightbox() { document.getElementById('lightbox').classList.add('active'); }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    /* LÓGICA DE ALTA AUTOMÁTICA Y DESCARGA DE PAQUETE ZIP (7 DÍAS) */
    async function solicitarTrialAutomatico(event) {
        event.preventDefault();
        
        const empresa = document.getElementById('trial-org').value.trim();
        const email = document.getElementById('trial-email').value.trim();
        const btn = document.getElementById('btn-trial-submit');

        if (!empresa || !email) {
            alert("⚠️ Por favor, introduce el nombre de tu Empresa y un Email corporativo válido.");
            return;
        }

        btn.innerText = "⏳ Generando Paquete ZIP...";
        btn.disabled = true;

        // URL Oficial de la API Serverless en Vercel
        const VERCEL_API_URL = 'https://saare-v7-iso42001-sable.vercel.app/api/trial';

        try {
            const response = await fetch(VERCEL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, empresa })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || `Error del servidor (${response.status})`);
            }

            // Recibir paquete ZIP binario desde Vercel
            const zipBlob = await response.blob();
            const safeCompanyName = empresa.replace(/[^a-zA-Z0-9_-]/g, '_');
            const fileName = `SAARE_v7.0_PRO_${safeCompanyName}.zip`;

            // Forzar descarga automática del paquete ZIP en el navegador
            const url = window.URL.createObjectURL(zipBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            alert("✅ ¡Paquete S.A.A.R.E. v7.0 PRO generado con éxito!\n\nDescomprime el archivo ZIP descargado para ejecutar la instalación y activar tu evaluación de 7 días.");

        } catch (err) {
            console.error("❌ Error en la emisión:", err);
            alert("❌ No se pudo generar la licencia de evaluación: " + err.message);
        } finally {
            btn.innerText = "⚡ Obtener Licencia de 7 Días →";
            btn.disabled = false;
        }
    }
</script>
